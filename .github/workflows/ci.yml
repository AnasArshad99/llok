name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The host side links Apple's Virtualization framework, so this needs
    # macOS. GitHub's Mac runners cannot boot VMs (no nested virtualization),
    # so this job compiles and runs unit tests only.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: guest agent (linux/arm64)
        run: make guest-agent
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./... -count=1
      - name: build
        run: go build -o llok ./cmd/llok
